<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>aiksee · 你自己的专属导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #0b0b10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 720px;
            width: 100%;
            background: rgba(18, 20, 28, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 28px 24px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            min-height: 620px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 16px 24px;
                border-radius: 36px;
                min-height: 560px;
            }
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
            flex-shrink: 0;
        }

        .logo {
            font-family: 'Inter', -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, sans-serif;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #d9ccff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
            display: inline-block;
            transition: transform 0.15s ease, filter 0.2s;
            text-shadow: 0 2px 16px rgba(160, 140, 255, 0.6);
        }
        .logo:active {
            transform: scale(0.96);
            filter: brightness(1.2);
        }

        .slogan {
            font-size: 0.9rem;
            color: #b3b7d9;
            margin-top: 6px;
            letter-spacing: 0.4px;
        }

        .shortcuts-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .shortcuts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
            gap: 22px 12px;
            margin: 8px 0 20px;
        }

        .shortcut {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #e0e2f0;
            cursor: grab;
            padding: 8px 4px;
            border-radius: 20px;
            transition: background 0.2s, transform 0.1s;
            -webkit-touch-callout: none;
            position: relative;
        }
        .shortcut:active { 
            cursor: grabbing; 
            background: rgba(124, 110, 255, 0.1);
        }

        .shortcut-icon {
            width: 60px;
            height: 60px;
            background: #1b1e28;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 600;
            color: #f0f2ff;
            border: 1.2px solid #4a4f6a;
            box-shadow: 0 6px 10px rgba(0,0,0,0.4);
            transition: border 0.2s, background 0.2s, color 0.2s;
            pointer-events: none;
            text-transform: uppercase;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        .shortcut:hover .shortcut-icon {
            border-color: #a28eff;
            background: #2d3348;
            color: #ffffff;
        }

        .shortcut-label {
            font-size: 0.75rem;
            margin-top: 8px;
            max-width: 88px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #c5c9e8;
            font-weight: 450;
            pointer-events: none;
        }

        .info {
            font-size: 0.78rem;
            color: #8b90b5;
            text-align: center;
            border-top: 0.5px solid #343a55;
            padding-top: 22px;
            margin-top: auto;
            line-height: 1.7;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }

        .empty-hint {
            grid-column: 1/-1;
            text-align: center;
            color: #a0a5ca;
            padding: 42px 0;
            font-size: 0.95rem;
            background: rgba(30, 34, 48, 0.5);
            border-radius: 48px;
            backdrop-filter: blur(4px);
        }

        /* ---------- 自定义右键菜单 (紧贴鼠标) ---------- */
        .context-menu {
            position: fixed;
            background: #1e212e;
            border-radius: 18px;
            padding: 6px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.7), 0 0 0 1px rgba(160, 140, 255, 0.2);
            backdrop-filter: blur(4px);
            z-index: 2000;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.15s, transform 0.15s;
            pointer-events: none;
            min-width: 100px;
        }
        .context-menu.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
        .context-menu-item {
            padding: 10px 18px;
            color: #f0f2ff;
            font-size: 0.9rem;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.1s;
            white-space: nowrap;
        }
        .context-menu-item:hover {
            background: #3a3f5e;
        }
        .context-menu-item.danger {
            color: #ff8a7a;
        }
        .context-menu-item.danger:hover {
            background: #4e2e3a;
        }

        /* 小型二次确认弹窗 (贴近菜单位置) */
        .confirm-pop {
            position: fixed;
            background: #232634;
            border-radius: 24px;
            padding: 14px 18px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7), 0 0 0 1px #4a3f6a;
            z-index: 2100;
            display: flex;
            gap: 12px;
            align-items: center;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.15s, transform 0.15s;
            pointer-events: none;
            color: #ddd;
            font-size: 0.9rem;
            backdrop-filter: blur(8px);
        }
        .confirm-pop.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
        .confirm-pop button {
            background: #363c58;
            border: none;
            border-radius: 30px;
            padding: 8px 16px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.1s;
            font-size: 0.8rem;
        }
        .confirm-pop button.danger {
            background: #c05a5a;
        }
        .confirm-pop button:hover {
            filter: brightness(1.2);
        }

        /* 添加弹窗 (原有) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 8, 16, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }
        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .modal-card {
            background: #1e212e;
            border-radius: 32px;
            padding: 28px 24px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.6), 0 0 0 1px rgba(200, 180, 255, 0.15);
            color: #f0f2ff;
            transform: scale(0.95);
            transition: transform 0.2s;
        }
        .modal-overlay.show .modal-card {
            transform: scale(1);
        }
        .modal-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 18px;
            background: linear-gradient(135deg, #fff, #cfc2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .modal-input {
            width: 100%;
            padding: 14px 16px;
            background: #12141c;
            border: 1.5px solid #3a3f5a;
            border-radius: 24px;
            color: white;
            font-size: 1rem;
            outline: none;
            margin-bottom: 20px;
            transition: border 0.15s;
        }
        .modal-input:focus {
            border-color: #a28eff;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-btn {
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            background: #2d3248;
            color: #ddd;
            transition: 0.15s;
        }
        .modal-btn.primary {
            background: #7c6eff;
            color: white;
        }
        .modal-btn.primary:hover {
            background: #9488ff;
        }
        .modal-btn:hover {
            background: #3e435e;
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="brand">
        <div class="logo" id="mainLogo" title="双击添加网站 · 本地优先">aiksee</div>
        <div class="slogan">见  未  见   ·   知  未  知</div>
    </div>
    
    <div class="shortcuts-wrapper">
        <div id="shortcutsContainer" class="shortcuts-grid"></div>
    </div>
    
    <div class="info">
        本地导航 · 数据保密 · 没有打扰 · 就是舒畅<br>
        ✨ 双击标题 · 拖拽排序 · 长按删除 ✨
    </div>
</div>

<!-- 自定义右键菜单 (动态) -->
<div class="context-menu" id="contextMenu">
    <div class="context-menu-item danger" id="menuDeleteBtn">🗑️ 删除</div>
</div>

<!-- 二次确认小弹窗 (贴近菜单) -->
<div class="confirm-pop" id="confirmPop">
    <span id="confirmText">确定删除？</span>
    <button id="confirmYesBtn" class="danger">删除</button>
    <button id="confirmNoBtn">取消</button>
</div>

<!-- 添加网站弹窗 -->
<div class="modal-overlay" id="addModal">
    <div class="modal-card">
        <div class="modal-title">📎 添加新网站</div>
        <input type="text" id="modalUrlInput" class="modal-input" placeholder="输入网址" value="https://www." autocomplete="off" enterkeyhint="done">
        <div class="modal-actions">
            <button class="modal-btn" id="modalCancelBtn">取消</button>
            <button class="modal-btn primary" id="modalConfirmBtn">添加</button>
        </div>
    </div>
</div>

<script>
    (function(){
        "use strict";

        const STORAGE_KEY = 'aiksee_links_v6';
        let links = [];

        const defaultLinks = [
            { url: 'https://www.deepseek.com/', title: 'DeepSeek', iconText: 'D' },
            { url: 'https://kimi.moonshot.cn/', title: 'Kimi', iconText: 'K' },
            { url: 'https://www.doubao.com/', title: '豆包', iconText: '豆' },
            { url: 'https://tongyi.aliyun.com/', title: '千问', iconText: '千' },
            { url: 'https://www.baidu.com/', title: '百度', iconText: '百' },
            { url: 'https://www.taobao.com/', title: '淘宝', iconText: '淘' },
            { url: 'https://www.jd.com/', title: '京东', iconText: '京' },
            { url: 'https://www.bilibili.com/', title: 'B站', iconText: 'B' },
            { url: 'https://www.zhihu.com/', title: '知乎', iconText: '知' },
            { url: 'https://www.douyin.com/', title: '抖音', iconText: '抖' }
        ];

        // DOM 元素
        const modalOverlay = document.getElementById('addModal');
        const modalInput = document.getElementById('modalUrlInput');
        const modalCancel = document.getElementById('modalCancelBtn');
        const modalConfirm = document.getElementById('modalConfirmBtn');
        const logoElement = document.getElementById('mainLogo');

        // 自定义右键菜单元素
        const contextMenu = document.getElementById('contextMenu');
        const menuDeleteBtn = document.getElementById('menuDeleteBtn');
        const confirmPop = document.getElementById('confirmPop');
        const confirmText = document.getElementById('confirmText');
        const confirmYesBtn = document.getElementById('confirmYesBtn');
        const confirmNoBtn = document.getElementById('confirmNoBtn');

        // 当前操作目标 (待删除的索引和标题)
        let pendingDeleteIndex = -1;
        let pendingDeleteTitle = '';

        // ---------- 添加弹窗逻辑 ----------
        function openModal() {
            modalInput.value = 'https://www.';
            modalOverlay.classList.add('show');
            modalInput.focus();
            modalInput.setSelectionRange(8, 12);
        }
        function closeModal() {
            modalOverlay.classList.remove('show');
        }
        modalCancel.addEventListener('click', closeModal);
        modalConfirm.addEventListener('click', () => {
            const rawUrl = modalInput.value.trim();
            if (rawUrl) addLink(rawUrl);
            closeModal();
        });
        modalInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                modalConfirm.click();
            }
        });
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });
        logoElement.addEventListener('dblclick', (e) => {
            e.preventDefault();
            openModal();
        });

        // ---------- 自定义菜单控制 ----------
        function showContextMenu(x, y, index, title) {
            pendingDeleteIndex = index;
            pendingDeleteTitle = title;
            
            // 定位菜单 (确保不超出视口)
            contextMenu.style.left = Math.min(x, window.innerWidth - 140) + 'px';
            contextMenu.style.top = Math.min(y, window.innerHeight - 60) + 'px';
            contextMenu.classList.add('show');
            
            // 隐藏确认弹窗 (如果之前打开)
            hideConfirmPop();
        }

        function hideContextMenu() {
            contextMenu.classList.remove('show');
        }

        function showConfirmPop(x, y) {
            confirmText.innerText = `确定删除 “${pendingDeleteTitle}” 吗？`;
            confirmPop.style.left = Math.min(x, window.innerWidth - 220) + 'px';
            confirmPop.style.top = Math.min(y, window.innerHeight - 70) + 'px';
            confirmPop.classList.add('show');
        }

        function hideConfirmPop() {
            confirmPop.classList.remove('show');
        }

        // 执行删除
        function performDelete() {
            if (pendingDeleteIndex !== -1) {
                deleteLink(pendingDeleteIndex);
            }
            hideContextMenu();
            hideConfirmPop();
            pendingDeleteIndex = -1;
        }

        // 菜单项点击：显示二次确认 (位置靠近菜单)
        menuDeleteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const rect = contextMenu.getBoundingClientRect();
            showConfirmPop(rect.right + 5, rect.top);
            hideContextMenu();  // 关闭菜单，显示确认框
        });

        // 确认删除
        confirmYesBtn.addEventListener('click', () => {
            performDelete();
        });
        confirmNoBtn.addEventListener('click', () => {
            hideConfirmPop();
            pendingDeleteIndex = -1;
        });

        // 点击页面其他地方关闭菜单和确认框
        document.addEventListener('click', (e) => {
            if (!contextMenu.contains(e.target)) {
                hideContextMenu();
            }
            if (!confirmPop.contains(e.target) && !menuDeleteBtn.contains(e.target)) {
                hideConfirmPop();
            }
        });
        document.addEventListener('contextmenu', (e) => {
            // 如果菜单打开且不是点击在shortcut上，隐藏
            if (!e.target.closest('.shortcut')) {
                hideContextMenu();
            }
        });

        // ---------- 核心数据操作 ----------
        function getTitleFromUrl(url) {
            try {
                const a = document.createElement('a');
                a.href = url;
                let host = a.hostname.replace(/^www\./, '');
                host = host.replace(/\.com(\.cn)?$|\.cn$|\.net$|\.org$/, '');
                return host || url;
            } catch { return url; }
        }

        function getIconTextFromTitle(title) {
            if (!title) return '🔗';
            const first = title.charAt(0);
            if (/[a-zA-Z]/.test(first)) return first.toUpperCase();
            return first;
        }

        function loadLinks() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    links = JSON.parse(stored);
                    if (!Array.isArray(links) || links.length === 0) throw new Error('empty');
                    links = links.map(item => {
                        if (!item.iconText) item.iconText = getIconTextFromTitle(item.title);
                        return item;
                    });
                } catch (e) { links = [...defaultLinks]; }
            } else { links = [...defaultLinks]; }
            saveLinks();
            renderLinks();
        }

        function saveLinks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
        }

        function addLink(rawUrl) {
            if (!rawUrl) return false;
            let url = rawUrl.trim();
            if (!url) return false;
            if (!url.startsWith('http')) url = 'https://' + url;
            if (!url.match(/^https?:\/\/.+/)) {
                alert('请输入有效网址');
                return false;
            }
            const title = getTitleFromUrl(url);
            const iconText = getIconTextFromTitle(title);
            links.push({ url, title, iconText });
            saveLinks();
            renderLinks();
            return true;
        }

        function deleteLink(index) {
            if (index >= 0 && index < links.length) {
                links.splice(index, 1);
                saveLinks();
                renderLinks();
            }
        }

        function renderLinks() {
            const container = document.getElementById('shortcutsContainer');
            container.innerHTML = '';

            if (links.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'empty-hint';
                emptyDiv.innerText = '✨ 双击上方 “aiksee” 添加网站 ✨';
                container.appendChild(emptyDiv);
                return;
            }

            links.forEach((link, idx) => {
                const card = document.createElement('div');
                card.className = 'shortcut';
                card.setAttribute('draggable', 'true');
                card.setAttribute('data-index', idx);

                // 拖拽排序
                card.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', idx.toString());
                    e.dataTransfer.effectAllowed = 'move';
                    card.style.opacity = '0.6';
                });
                card.addEventListener('dragend', (e) => card.style.opacity = '');
                card.addEventListener('dragover', (e) => e.preventDefault());
                card.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
                    const toIdx = idx;
                    if (!isNaN(fromIdx) && fromIdx !== toIdx) {
                        const moved = links.splice(fromIdx, 1)[0];
                        links.splice(toIdx, 0, moved);
                        saveLinks();
                        renderLinks();
                    }
                });

                // 图标/文字
                const iconDiv = document.createElement('div');
                iconDiv.className = 'shortcut-icon';
                let displayText = link.iconText;
                if (displayText.length > 2) displayText = displayText.slice(0,2);
                iconDiv.innerText = displayText;

                const labelSpan = document.createElement('span');
                labelSpan.className = 'shortcut-label';
                labelSpan.innerText = link.title;

                card.appendChild(iconDiv);
                card.appendChild(labelSpan);

                // 点击打开链接
                card.addEventListener('click', (e) => {
                    // 防止菜单操作干扰
                    if (contextMenu.classList.contains('show')) return;
                    window.open(link.url, '_blank');
                });

                // 右键：自定义菜单
                card.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    showContextMenu(e.clientX, e.clientY, idx, link.title);
                });

                // 移动端长按：同样触发菜单 (使用触摸位置)
                let longPressTimer = null;
                let touchMoved = false;
                card.addEventListener('touchstart', (e) => {
                    touchMoved = false;
                    longPressTimer = setTimeout(() => {
                        if (!touchMoved) {
                            const touch = e.touches[0];
                            showContextMenu(touch.clientX, touch.clientY, idx, link.title);
                        }
                    }, 600);
                }, { passive: true });
                card.addEventListener('touchmove', () => { touchMoved = true; clearTimeout(longPressTimer); });
                card.addEventListener('touchend', () => clearTimeout(longPressTimer));
                card.addEventListener('touchcancel', () => clearTimeout(longPressTimer));

                container.appendChild(card);
            });
        }

        document.addEventListener('dragover', (e) => e.preventDefault());
        document.addEventListener('drop', (e) => e.preventDefault());

        loadLinks();
    })();
</script>
</body>
</html>
